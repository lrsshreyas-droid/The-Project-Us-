<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom To-Do Manager</title>
  <style>
    body { font-family: sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: auto; background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #333; }
    .input-group { display: flex; gap: 8px; margin-bottom: 16px; }
    input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    input[type="text"] { flex: 1; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    li.completed span { text-decoration: line-through; color: #888; }
    .delete-btn { background: #ef4444; padding: 4px 8px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Customized To-Do List</h1>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <select id="categorySelect">
        <option value="General">General</option>
        <option value="Venue">Venue</option>
        <option value="Attire">Attire</option>
        <option value="Logistics">Logistics</option>
      </select>
      <button onclick="addTask()">Add</button>
    </div>
    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('todo_tasks')) || [];

    function saveAndRender() {
      localStorage.setItem('todo_tasks', JSON.stringify(tasks));
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');
        li.innerHTML = `
          <label>
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
            <span>[${task.category}] ${task.title}</span>
          </label>
          <button class="delete-btn" onclick="deleteTask(${index})">Delete</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const category = document.getElementById('categorySelect').value;
      if (!input.value.trim()) return;
      tasks.push({ title: input.value.trim(), category, completed: false });
      input.value = '';
      saveAndRender();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      saveAndRender();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      saveAndRender();
    }

    saveAndRender();
  </script>
</body>
</html>
