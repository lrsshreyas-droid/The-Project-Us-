<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Story & Planner</title>
  <style>
    :root {
      --primary: #e11d48;
      --primary-light: #ffe4e6;
      --bg-gradient: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #4c0519;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating Hearts Background Animation */
    .bg-hearts {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(225, 29, 72, 0.15);
      font-size: 20px;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
      20% { opacity: 0.8; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    .app-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      width: 100%;
      max-width: 650px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(225, 29, 72, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
      font-size: 2rem;
      letter-spacing: -0.5px;
    }

    /* Progress Visualizer */
    .progress-box {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .bar-outer {
      height: 12px;
      background: #f1f5f9;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-inner {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #fb7185, #e11d48);
      border-radius: 6px;
      transition: width 0.4s ease;
    }

    /* Input Controls */
    .input-form {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select, button {
      padding: 12px;
      border: 1px solid #fecdd3;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #be123c;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .filter-btn {
      background: white;
      color: var(--text);
      border: 1px solid #fecdd3;
      padding: 6px 14px;
      font-size: 13px;
      border-radius: 20px;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Task List */
    .task-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task-item {
      background: white;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: transform 0.2s, opacity 0.2s;
    }

    .task-item.completed {
      opacity: 0.6;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
    }

    .left-side {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
    }

    .delete-btn {
      background: transparent;
      color: #94a3b8;
      padding: 4px 8px;
      font-size: 16px;
    }

    .delete-btn:hover {
      color: var(--primary);
      background: transparent;
    }
  </style>
</head>
<body>

  <!-- Floating Hearts Background -->
  <div class="bg-hearts" id="heartsContainer"></div>

  <div class="app-card">
    <h1>💕 Our Wedding Planner</h1>

    <!-- Completion Dashboard -->
    <div class="progress-box">
      <div class="progress-header">
        <span>Planning Progress</span>
        <span id="progressText">0%</span>
      </div>
      <div class="bar-outer">
        <div class="bar-inner" id="progressBar"></div>
      </div>
    </div>

    <!-- Task Form -->
    <div class="input-form">
      <input type="text" id="taskInput" placeholder="Add a romantic detail or goal...">
      <select id="categorySelect">
        <option value="Venue">Venue</option>
        <option value="Attire">Attire</option>
        <option value="Decor">Decor</option>
        <option value="Logistics">Logistics</option>
      </select>
      <button onclick="addTask()">+ Add</button>
    </div>

    <!-- Category Filter Tabs -->
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('All', this)">All Tasks</button>
      <button class="filter-btn" onclick="setFilter('Venue', this)">Venue</button>
      <button class="filter-btn" onclick="setFilter('Attire', this)">Attire</button>
      <button class="filter-btn" onclick="setFilter('Decor', this)">Decor</button>
      <button class="filter-btn" onclick="setFilter('Logistics', this)">Logistics</button>
    </div>

    <!-- Items -->
    <ul class="task-list" id="taskList"></ul>
  </div>

  <script>
    // Create animated floating hearts
    const heartsContainer = document.getElementById('heartsContainer');
    const heartSymbols = ['❤️', '💖', '💕', '💗', '🌸'];

    for (let i = 0; i < 20; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (6 + Math.random() * 6) + 's';
      heart.style.animationDelay = Math.random() * 5 + 's';
      heartsContainer.appendChild(heart);
    }

    // Default Tasks Data
    let tasks = JSON.parse(localStorage.getItem('romantic_wedding_tasks')) || [
      { title: 'Reserve Dream Venue', category: 'Venue', completed: true },
      { title: 'Choose Floral Color Palette', category: 'Decor', completed: false },
      { title: 'Schedule Attire Fitting', category: 'Attire', completed: false },
      { title: 'Finalize Guest List', category: 'Logistics', completed: false }
    ];

    let currentFilter = 'All';

    function render() {
      localStorage.setItem('romantic_wedding_tasks', JSON.stringify(tasks));
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      const filtered = currentFilter === 'All' 
        ? tasks 
        : tasks.filter(t => t.category === currentFilter);

      filtered.forEach((task, index) => {
        const realIndex = tasks.indexOf(task);
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="left-side">
            <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${realIndex})">
            <span class="task-text">${task.title}</span>
            <span class="tag">${task.category}</span>
          </div>
          <button class="delete-btn" onclick="deleteTask(${realIndex})">✕</button>
        `;
        list.appendChild(li);
      });

      // Update progress bar
      const completedCount = tasks.filter(t => t.completed).length;
      const percent = tasks.length ? Math.round((completedCount / tasks.length) * 100) : 0;
      document.getElementById('progressBar').style.width = percent + '%';
      document.getElementById('progressText').innerText = percent + '% Completed';
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const category = document.getElementById('categorySelect').value;
      if (!input.value.trim()) return;
      tasks.push({ title: input.value.trim(), category, completed: false });
      input.value = '';
      render();
    }

    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      render();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      render();
    }

    function setFilter(category, btn) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    render();
  </script>
</body>
</html>
